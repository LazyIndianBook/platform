# The documentation portal: `make docs` (scripts/docs/build_site.py gathers the documents into .docs-build/, then
# mkdocs builds site/); `make docs-serve` to read it at http://localhost:8008/. docs/STYLE.md is the standard.
site_name: ExamLeaf platform
site_description: The website, API, staff console, ERPNext back office and deployment of ExamLeaf, documented.
site_url: https://docs.examleaf.in/
repo_url: https://github.com/LazyIndianBook/platform
repo_name: LazyIndianBook/platform
docs_dir: .docs-build
site_dir: site
use_directory_urls: true
strict: false

theme:
  name: material
  language: en
  custom_dir: docs/assets/overrides
  logo: docs/assets/mark.svg
  favicon: docs/assets/mark.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - docs/assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Start here:
      - The repository: repository.md
      - Handover: docs/HANDOVER.md
      - The documentation standard: docs/STYLE.md
      - Decisions register: docs/decisions.md
      - Changelog: examleaf-web/CHANGELOG.md
  - Backend:
      - Overview: examleaf-web/README.md
      - API: examleaf-web/API.md
      - Deployment: examleaf-web/DEPLOYMENT.md
      - Runbook: examleaf-web/RUNBOOK.md
      - Resilience: examleaf-web/RESILIENCE.md
      - Apps:
          - Staff and the panel: examleaf-web/staff/README.md
          - Shop: examleaf-web/shop/README.md
          - Content: examleaf-web/content/README.md
          - Course: examleaf-web/learn/README.md
          - Support: examleaf-web/support/README.md
          - Insights: examleaf-web/insights/README.md
          - Shipping: examleaf-web/shipping/README.md
