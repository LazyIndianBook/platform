# ExamLeaf web: lint and tests on PostgreSQL 17 for every push to main and every pull request that touches the site
# (the backend, the website, the staff console). The dependency audit also runs every Monday and on demand, so that the
# report the System page reads does not age for want of a push (DEPLOYMENT.md section 25).
# The import tests and the Playwright backend read the test papers committed in examleaf-web/content/fixtures/papers/:
# no checkout of the books repository (LazyIndianBook/Class-12-Assam) is needed.
name: examleaf-web

on:
  push:
    branches: [main]
    paths: ["examleaf-web/**", "examleaf-frontend/**", "examleaf-admin/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["examleaf-web/**", "examleaf-frontend/**", "examleaf-admin/**", ".github/workflows/ci.yml"]
  schedule:
    - cron: "30 20 * * 0"  # Mondays 02:00 India time: before the Monday 09:00 check of the report's age
  workflow_dispatch:  # Actions, "examleaf-web", Run workflow

permissions:
  contents: read  # the jobs only read the code

jobs:
  test:
    if: github.event_name != 'schedule'  # (every job but the audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examleaf-web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: examleaf
          POSTGRES_PASSWORD: examleaf
          POSTGRES_DB: examleaf
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret-but-fifty-characters-long-as-settings-ask
      LEARN_CODE_SECRET: ci-only-book-code-secret-not-for-production
      DATABASE_URL: postgres://examleaf:examleaf@localhost:5432/examleaf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examleaf-web/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: pytest --cov --cov-report=term

  docker-build:
    # The production image builds (system libraries, pinned requirements, collectstatic) and Django starts in it.
    # Nothing is pushed.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --tag examleaf-web:ci examleaf-web
      - name: Django and WeasyPrint load in the image
        run: |
          docker run --rm -e SECRET_KEY=ci-only-not-secret-but-fifty-characters-long-as-settings-ask -e LEARN_CODE_SECRET=ci-only-not-secret -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 -e EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend -e LEARN_CODE_SECRET=ci-only-book-code-secret examleaf-web:ci python manage.py check --deploy --fail-level ERROR
          docker run --rm examleaf-web:ci python -c "import weasyprint"

  dependency-audit:
    # Known vulnerabilities in the pinned runtime packages (pip-audit, PyPI's advisory database) and in the two Next.js
    # apps' production packages (npm audit), written as one report (scripts/dependency_report.py), kept as an artifact
    # the deploy loads (manage.py load_dependency_report) for the console's System page. Reported, not yet blocking: a
    # finding shows as a failed job without failing the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: examleaf-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pip install -r requirements.txt pip-audit
      - name: The audits, as JSON (their findings fail the last step, not these)
        run: |
          pip-audit --format json --output ../pip-audit.json || true
          (cd ../examleaf-frontend && npm audit --omit=dev --json > ../npm-audit-frontend.json) || true
          (cd ../examleaf-admin && npm audit --omit=dev --json > ../npm-audit-admin.json) || true
      - name: The dependency report, strict (an audit that did not run makes no artifact, not a clean one)
        run: >
          python scripts/dependency_report.py --strict --pip ../pip-audit.json --npm frontend=../npm-audit-frontend.json
          --npm admin=../npm-audit-admin.json
          --version "next=$(node -p "require('../examleaf-admin/package.json').dependencies.next")"
          --commit "$GITHUB_SHA" --output ../dependency-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
          retention-days: 90
      - run: pip-audit

  frontend:
    # The Next.js frontend (examleaf-frontend/, Phase 8): lint and formatting, types, Vitest, the production build,
    # then the Playwright smoke tests against that build and a Django backend that scripts/e2e-backend.sh seeds from
    # examleaf-web (a fresh SQLite database: the test papers of content/fixtures/papers/, the shop's starting catalogue,
    # an open sample).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examleaf-frontend
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      API_INTERNAL_BASE: http://localhost:8100
      DJANGO_DATABASE_URL: sqlite:////tmp/examleaf-e2e.sqlite3
      DJANGO_LOG: /tmp/examleaf-e2e-django.log
      SECRET_KEY: dev-ci-only-not-secret
      LEARN_CODE_SECRET: ci-only-book-code-secret-not-for-production
      DJANGO_PYTHON: python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examleaf-frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examleaf-web/requirements*.txt
      - name: Django for the smoke tests
        run: pip install -r requirements.txt
        working-directory: examleaf-web
      - run: npm ci
      - name: Lint and formatting
        run: npm run lint && npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke tests (Playwright, Chromium)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Keep the report and Django's log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke
          path: |
            examleaf-frontend/playwright-report/
            /tmp/examleaf-e2e-django.log
          retention-days: 7

  admin:
    # The staff console (examleaf-admin/, the Admin Control Panel): lint and formatting, types and Vitest, the checks its
    # README asks of every change. Its Playwright journeys (the mock, and the real backend) start next dev and Django
    # together, and stay a local check (examleaf-admin/README.md "Tests"). Its npm audit is the dependency-audit job's.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examleaf-admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examleaf-admin/package-lock.json
      - run: npm ci
      - name: Lint and formatting
        run: npm run lint && npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm test
