# ExamLeaf web: lint and tests on PostgreSQL 17 for every push and pull request that touches the site or the papers
# (the import tests read production/).
name: examleaf-web

on:
  push:
    paths: ["examleaf-web/**", "production/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["examleaf-web/**", "production/**", ".github/workflows/ci.yml"]

permissions:
  contents: read  # the jobs only read the code

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examleaf-web
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: examleaf
          POSTGRES_PASSWORD: examleaf
          POSTGRES_DB: examleaf
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret-but-fifty-characters-long-as-settings-ask
      DATABASE_URL: postgres://examleaf:examleaf@localhost:5432/examleaf
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: examleaf-web/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: pytest --cov --cov-report=term

  docker-build:
    # The production image builds (system libraries, pinned requirements, collectstatic) and Django starts in it.
    # Nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build --tag examleaf-web:ci examleaf-web
      - name: Django and WeasyPrint load in the image
        run: |
          docker run --rm -e SECRET_KEY=ci-only-not-secret-but-fifty-characters-long-as-settings-ask -e LEARN_CODE_SECRET=ci-only-not-secret -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 -e EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend examleaf-web:ci python manage.py check --deploy --fail-level ERROR
          docker run --rm examleaf-web:ci python -c "import weasyprint"

  dependency-audit:
    # Known vulnerabilities in the pinned runtime packages (pip-audit, PyPI's advisory database). Reported, not yet
    # blocking: a finding shows as a failed job without failing the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: examleaf-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit
