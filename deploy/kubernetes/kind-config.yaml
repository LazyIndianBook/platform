# The laptop cluster of TESTING.md (`make kind-up`): one node, control plane and worker in one, at the newest
# Kubernetes that ingress-nginx's last release supports (1.35). The host's ports 80 and 443 go to the node, where
# ingress-nginx's kind manifest listens on them (hostPort).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: examleaf-test
nodes:
  - role: control-plane
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
