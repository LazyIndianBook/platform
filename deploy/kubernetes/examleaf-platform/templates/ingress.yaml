{{- /* The Caddyfile's routing on ingress-nginx, in four Ingresses because ingress-nginx's settings are per Ingress:
         <release>          Django's paths to web, every other path to the frontend; bodies up to 10 MB
         <release>-uploads  the clip and revision admin pages: bodies up to 500 MB, streamed to gunicorn
         <release>-health   /health and /health/*: only the uptime monitor (basic auth)
         <release>-admin    admin.<domain> to the admin panel, with an optional allowlist
       Each lists its host's TLS Secret, so that every path redirects http to https; cert-manager is asked for a
       certificate on the main and the admin Ingress only. The response headers stay Django's and Next's: nothing is
       added or removed here (the controller's own HSTS is off: README.md "The ingress controller"). */ -}}
{{- $fullname := include "examleaf.fullname" . -}}
{{- $labels := dict "ctx" . "component" "ingress" "app" "examleaf" "version" .Values.image.tag -}}
{{- $tlsSecret := .Values.ingress.tlsSecret | default (printf "%s-tls" $fullname) -}}
{{- $adminHost := include "examleaf.adminHost" . -}}
{{- $adminTlsSecret := .Values.ingress.adminTlsSecret | default (printf "%s-admin-tls" $fullname) -}}
{{- /* the Caddyfile's @django matcher, but /health (its own Ingress) and the upload pages (theirs) */ -}}
{{- $djangoPaths := list "/api" "/_allauth" "/admin" "/shop/webhooks" "/anymail" "/shop/media" "/learn/preview" "/learn/hls" "/account/google" "/qr" "/static" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize }}
    nginx.ingress.kubernetes.io/preserve-trailing-slash: "true"  # the https redirect keeps /api/v1/config/ whole
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ $tlsSecret }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          {{- range $djangoPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port: {name: http}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-frontend
                port: {name: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-uploads
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
  annotations:
    # the Caddyfile's @clip_upload: in production the editor's browser sends the video to the bucket and these
    # pages get its name only; without a bucket the file comes with the form, and Django takes a body this large
    # from signed-in staff only (learn.uploads.LargeBodyGuard)
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.uploadBodySize }}
    nginx.ingress.kubernetes.io/preserve-trailing-slash: "true"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ $tlsSecret }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          {{- range list "/admin/learn/clip" "/admin/learn/revision" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port: {name: http}
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-health
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-secret: {{ include "examleaf.healthAuthSecret" . }}
    nginx.ingress.kubernetes.io/preserve-trailing-slash: "true"
    {{- toYaml .Values.ingress.healthAnnotations | nindent 4 }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ $tlsSecret }}
    {{- if .Values.admin.enabled }}
    - hosts: [{{ $adminHost | quote }}]
      secretName: {{ $adminTlsSecret }}
    {{- end }}
  rules:
    {{- /* the admin host too: a Next.js server may pass /health on to Django, as the website's src/proxy.ts does */}}
    {{- range $host := concat (list .Values.domain) (.Values.admin.enabled | ternary (list $adminHost) (list)) }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port: {name: http}
    {{- end }}
{{- if .Values.admin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-admin
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
  annotations:
    {{- with .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.bodySize }}
    nginx.ingress.kubernetes.io/preserve-trailing-slash: "true"  # the https redirect keeps /api/v1/config/ whole
    {{- with .Values.admin.allowlist }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ $adminHost | quote }}]
      secretName: {{ $adminTlsSecret }}
  rules:
    - host: {{ $adminHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-admin
                port: {name: http}
{{- end }}
