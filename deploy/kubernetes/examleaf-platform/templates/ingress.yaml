{{- /* One Ingress for Traefik. Call with (dict "ctx" $ "name" … "entrypoint" "websecure" "middlewares" (list "compress")
       "tls" (list (dict "hosts" (list …) "secretName" …)) "certificate" true "rules" (list (dict "host" … "paths"
       (list (dict "path" "/api/" "type" "Prefix" "service" "examleaf-web" "port" "http"))))). Middlewares are this
       chart's (middlewares.yaml, erpnext.yaml), named without the release's prefix. */ -}}
{{- define "examleaf.ingress" -}}
{{- $ctx := .ctx -}}
{{- $fullname := include "examleaf.fullname" $ctx -}}
{{- $refs := list -}}
{{- range .middlewares }}{{ $refs = append $refs (printf "%s-%s-%s@kubernetescrd" $ctx.Release.Namespace $fullname .) }}{{ end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  labels:
    {{- include "examleaf.labels" (dict "ctx" $ctx "component" "ingress" "app" "examleaf" "version" $ctx.Values.image.tag) | nindent 4 }}
  annotations:
    {{- if and .certificate $ctx.Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ctx.Values.ingress.clusterIssuer }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .entrypoint }}
    {{- with $refs }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . }}
    {{- end }}
    {{- with $ctx.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ctx.Values.ingress.className }}
  {{- with .tls }}
  tls:
    {{- range . }}
    - hosts: {{ toJson .hosts }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .rules }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .type | default "Prefix" }}
            backend:
              service:
                name: {{ .service }}
                port:
                  {{- if kindIs "string" .port }}
                  name: {{ .port }}
                  {{- else }}
                  number: {{ .port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end -}}

{{- /* The Caddyfile's routing for Traefik. Each host's Ingresses differ in their middlewares (Traefik's annotation is per
       Ingress); a longer rule wins, so the specific paths go before "/". Paths keep the Caddyfile's trailing slashes
       (/api/* there): Traefik matches a Prefix path character by character unless strictPrefixMatching is on, and
       either way /apiary stays the website's.
         <release>, <release>-admin                Django's form and API paths: body-limit, compress, strip-server
         <release>-files, <release>-admin-files    Django's file paths (static, pictures, the course's video): streamed
         <release>-uploads, <release>-admin-uploads  the clip and revision admin pages: streamed (Django refuses a
                                                  large body from anyone but signed-in staff before reading it)
         <release>-health                           /health and /health/*: basic auth for the uptime monitor
         <release>-site, <release>-admin-site       every other path to the website or the admin panel: health-hide
                                                  (and drop-subrequest on the admin host)
         <release>-http                             http on every host: redirect-https
       The admin host's every Ingress takes admin-allowlist first when admin.allowlist is set. */ -}}
{{- $fullname := include "examleaf.fullname" . -}}
{{- $web := printf "%s-web" $fullname -}}
{{- $django := list "/api/" "/_allauth/" "/admin/" "/shop/webhooks/" "/anymail/" "/account/google/" -}}
{{- $files := list "/static/" "/shop/media/" "/learn/preview/" "/learn/hls/" "/qr/" -}}
{{- $uploads := list "/admin/learn/clip/" "/admin/learn/revision/" -}}
{{- $hosts := list (dict "name" $fullname "host" .Values.domain "site" (printf "%s-frontend" $fullname) "tlsSecret" (.Values.ingress.tlsSecret | default (printf "%s-tls" $fullname)) "first" (list)) -}}
{{- if .Values.admin.enabled }}
{{- $hosts = append $hosts (dict "name" (printf "%s-admin" $fullname) "host" (include "examleaf.adminHost" .) "site" (printf "%s-admin" $fullname) "tlsSecret" (.Values.ingress.adminTlsSecret | default (printf "%s-admin-tls" $fullname)) "first" (empty .Values.admin.allowlist | ternary (list) (list "admin-allowlist"))) }}
{{- end }}
{{- $redirectRules := list -}}
{{- range $i, $h := $hosts }}
{{- $tls := list (dict "hosts" (list $h.host) "secretName" $h.tlsSecret) }}
{{- $toWeb := dict }}
{{- range $group, $paths := dict "django" $django "files" $files "uploads" $uploads }}
{{- $list := list }}
{{- range $paths }}{{ $list = append $list (dict "path" . "service" $web "port" "http") }}{{ end }}
{{- $_ := set $toWeb $group $list }}
{{- end }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" $h.name "entrypoint" "websecure" "certificate" true "tls" $tls
      "middlewares" (concat $h.first (list "body-limit" "compress" "strip-server"))
      "rules" (list (dict "host" $h.host "paths" $toWeb.django))) }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" (printf "%s-files" $h.name) "entrypoint" "websecure" "tls" $tls
      "middlewares" (concat $h.first (list "strip-server"))
      "rules" (list (dict "host" $h.host "paths" $toWeb.files))) }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" (printf "%s-uploads" $h.name) "entrypoint" "websecure" "tls" $tls
      "middlewares" (concat $h.first (list "strip-server"))
      "rules" (list (dict "host" $h.host "paths" $toWeb.uploads))) }}
{{- if eq $i 0 }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" (printf "%s-health" $h.name) "entrypoint" "websecure" "tls" $tls
      "middlewares" (list "health-auth" "strip-server")
      "rules" (list (dict "host" $h.host "paths" (list
        (dict "path" "/health" "type" "Exact" "service" $web "port" "http")
        (dict "path" "/health/" "service" $web "port" "http"))))) }}
{{- end }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" (printf "%s-site" $h.name) "entrypoint" "websecure" "tls" $tls
      "middlewares" (concat $h.first (list "health-hide") (eq $i 0 | ternary (list) (list "drop-subrequest")))
      "rules" (list (dict "host" $h.host "paths" (list (dict "path" "/" "service" $h.site "port" "http"))))) }}
{{- $redirectRules = append $redirectRules (dict "host" $h.host "paths" (list (dict "path" "/" "service" (printf "%s-frontend" $fullname) "port" "http"))) }}
{{- end }}
{{- if .Values.erpnext.enabled }}
{{- $redirectRules = append $redirectRules (dict "host" .Values.erp.host "paths" (list (dict "path" "/" "service" (printf "%s-frontend" $fullname) "port" "http"))) }}
{{- end }}
---
{{ include "examleaf.ingress" (dict "ctx" $ "name" (printf "%s-http" $fullname) "entrypoint" "web"
      "middlewares" (list "redirect-https") "rules" $redirectRules) }}
