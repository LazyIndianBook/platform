{{- /* Two optional CronJobs on examleaf-web's image: the smoke test (manage.py health_check against the web Service)
       and, only while beat is switched off, the shop's daily clean-up that beat otherwise runs. */ -}}
{{- define "examleaf.cronJob" -}}
{{- $ctx := .ctx -}}
{{- $labels := dict "ctx" $ctx "component" .component "version" $ctx.Values.image.tag -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "examleaf.fullname" $ctx }}-{{ .component }}
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  {{- with .timeZone }}
  timeZone: {{ . }}
  {{- end }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # a failure shows as a failed Job; the next run comes on schedule
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            {{- include "examleaf.labels" $labels | nindent 12 }}
        spec:
          {{- include "examleaf.podSpecCommon" $ctx | nindent 10 }}
          restartPolicy: Never
          containers:
            - name: {{ .component }}
              image: {{ include "examleaf.webImage" $ctx }}
              imagePullPolicy: {{ $ctx.Values.image.pullPolicy }}
              command:
                {{- toYaml .command | nindent 16 }}
              {{- include "examleaf.djangoEnv" $ctx | nindent 14 }}
              securityContext:
                {{- toYaml $ctx.Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml $ctx.Values.initResources | nindent 16 }}
              volumeMounts:
                {{- include "examleaf.djangoVolumeMounts" $ctx | nindent 16 }}
          volumes:
            {{- include "examleaf.djangoVolumes" (dict "ctx" $ctx "tmpSize" "256Mi") | nindent 12 }}
{{- end -}}

{{- if .Values.cronJobs.healthCheck.enabled }}
---
{{- /* /health/web/ over the web Service (database, cache, storage; the command sends X-Forwarded-Host and https, no
       basic auth inside the cluster), then the queues the workers consume. Not /health/'s Celery ping: it stops at the
       first answer (limit=1), and when that is the media worker's it says the default queue has no worker, which on
       the kind run happened in four asks of six (DEPLOYMENT.md section 7: "look again"). */}}
{{- $queues := concat (list "celery") (.Values.mediaWorker.enabled | ternary (list "media") (list)) }}
{{ include "examleaf.cronJob" (dict "ctx" . "component" "health-check" "schedule" .Values.cronJobs.healthCheck.schedule
      "command" (list "sh" "-c" (printf `python manage.py health_check health_web %s-web:8000 && celery -A examleaf inspect active_queues --timeout 10 --json | python -c 'import json, sys; served = {q["name"] for qs in json.load(sys.stdin).values() for q in qs}; print("queues with a worker:", sorted(served)); sys.exit(not %s <= served)'` (include "examleaf.fullname" .) (toJson $queues | replace "[" "{" | replace "]" "}")))) }}
{{- end }}
{{- if not .Values.beat.enabled }}
---
{{ include "examleaf.cronJob" (dict "ctx" . "component" "shop-clean-up" "schedule" .Values.cronJobs.shopCleanUp.schedule
      "timeZone" .Values.cronJobs.shopCleanUp.timeZone
      "command" (list "python" "manage.py" "shell" "-c" "from shop.tasks import clean_up; clean_up()")) }}
{{- end }}
