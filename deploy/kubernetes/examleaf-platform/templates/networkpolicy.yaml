{{- /* the site's pods by component, e.g. (include "examleaf.from" (dict "ctx" $ "components" (list "web"))) */ -}}
{{- define "examleaf.from" -}}
podSelector:
  matchLabels:
    app.kubernetes.io/instance: {{ .ctx.Release.Name }}
  matchExpressions:
    - key: app.kubernetes.io/component
      operator: In
      values: {{ toJson .components }}
{{- end -}}

{{- /* Nothing reaches a pod of this namespace unless a policy below lets it: the compose network's isolation, made
       explicit. Egress stays open (DNS, the buckets, email, SMS, Razorpay, Sentry; the operator's pods talk to the
       Kubernetes API). A pod added to the namespace (ERPNext's, say) needs a policy of its own. */ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "examleaf.fullname" . -}}
{{- $labels := dict "ctx" . "component" "network-policy" "app" "examleaf" "version" .Values.image.tag -}}
{{- $controller := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.ingress.controllerNamespace)) "podSelector" (dict "matchLabels" .Values.ingress.controllerPodLabels) -}}
{{- $webFrom := list $controller (include "examleaf.from" (dict "ctx" . "components" (list "frontend" "admin" "health-check")) | fromYaml) -}}
{{- if .Values.erpnext.enabled }}{{/* ERPNext's webhooks to the platform, by the web Service */}}
{{- $webFrom = append $webFrom (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/app" "frappe"))) -}}
{{- end }}
{{- $policies := list
  (dict "name" "web" "selector" (dict "app.kubernetes.io/component" "web") "port" 8000 "from" $webFrom)
  (dict "name" "frontend" "selector" (dict "app.kubernetes.io/component" "frontend") "port" 3000 "from" (list $controller))
  (dict "name" "admin" "selector" (dict "app.kubernetes.io/component" "admin") "port" 3000 "from" (list $controller))
  (dict "name" "redis-queue" "selector" (dict "app.kubernetes.io/component" "redis-queue") "port" 6379
        "from" (list (include "examleaf.from" (dict "ctx" . "components" (list "web" "worker" "beat" "media-worker" "shop-clean-up")) | fromYaml)))
  (dict "name" "redis-cache" "selector" (dict "app.kubernetes.io/component" "redis-cache") "port" 6379
        "from" (list (include "examleaf.from" (dict "ctx" . "components" (list "web" "worker" "beat" "shop-clean-up")) | fromYaml)))
  (dict "name" "acme-solver" "selector" (dict "acme.cert-manager.io/http01-solver" "true") "port" 8089 "from" (list $controller))
-}}
{{- $databaseClients := include "examleaf.from" (dict "ctx" . "components" (list "web" "worker" "beat" "media-worker" "shop-clean-up")) | fromYaml -}}
{{- if .Values.postgres.pooler.enabled }}
{{- $policies = append $policies (dict "name" "pooler" "selector" (dict "cnpg.io/poolerName" (printf "%s-pooler" (include "examleaf.dbCluster" .))) "port" 5432 "from" (list $databaseClients)) -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
{{- range $policies }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ .name }}
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- if ne .name "acme-solver" }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- end }}
      {{- toYaml .selector | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        - port: {{ .port }}
{{- end }}
---
# PostgreSQL: the site's pods (the migrations still connect directly with the pooler on) and the pooler's; the
# operator (its instance manager on 8000, the database on 5432); the instances among themselves (replication, once
# there are standbys)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-database
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "examleaf.dbCluster" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - {{- toYaml $databaseClients | nindent 10 }}
        {{- if .Values.postgres.pooler.enabled }}
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: {{ include "examleaf.dbCluster" . }}-pooler
        {{- end }}
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpgNamespace }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "examleaf.dbCluster" . }}
      ports:
        - port: 5432
        - port: 8000
{{- if .Values.monitoring.enabled }}
---
# Prometheus's scrapes (values.yaml "monitoring"): PostgreSQL's and the pooler's metrics, and redis_exporter's
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-metrics
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
      ports:
        - port: 9187
        - port: 9127
        - port: 9121
{{- end }}
{{- end }}
