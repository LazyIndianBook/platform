{{- /* secrets.mode "externalSecret": the External Secrets Operator writes the Secrets that the chart reads, from the
       store in secrets.externalSecret. With mode "existing" you create them yourself (README.md "Secrets"). */ -}}
{{- $mode := .Values.secrets.mode -}}
{{- if not (has $mode (list "existing" "externalSecret")) }}
{{- fail (printf "secrets.mode is %q: use \"existing\" or \"externalSecret\"" $mode) }}
{{- end }}
{{- if eq $mode "externalSecret" }}
{{- $es := .Values.secrets.externalSecret -}}
{{- $labels := dict "ctx" . "component" "secrets" "app" "examleaf" "version" .Values.image.tag -}}
{{- $store := dict "kind" $es.storeRef.kind "name" (required "secrets.externalSecret.storeRef.name" $es.storeRef.name) -}}
{{- $extracts := list (dict "name" (include "examleaf.envSecret" .) "key" $es.envKey) -}}
{{- if or .Values.postgres.backup.enabled .Values.postgres.recovery.enabled }}
{{- $extracts = append $extracts (dict "name" (include "examleaf.backupSecret" .) "key" $es.backupKey) }}
{{- end }}
{{- range $extracts }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .key }}
{{- end }}
---
# the uptime monitor's line for ingress-nginx's basic auth, from HEALTH_CHECK_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "examleaf.healthAuthSecret" . }}
  labels:
    {{- include "examleaf.labels" $labels | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- toYaml $store | nindent 4 }}
  target:
    name: {{ include "examleaf.healthAuthSecret" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth: {{ printf "monitor:{PLAIN}{{ .token }}" | quote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ $es.healthTokenKey }}
        property: {{ $es.healthTokenProperty }}
{{- end }}
