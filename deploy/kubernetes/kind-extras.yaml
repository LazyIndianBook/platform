# The kind test cluster's stand-ins (TESTING.md), applied by `make kind-up` once the operators run: a self-signed
# ClusterIssuer for Let's Encrypt, and RustFS, an S3-compatible store, for Cloudflare R2. Its keys are made by
# `make kind-secrets` (the Secret rustfs-root, the same values as the chart's backup Secret). Never on a real cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kind-selfsigned
spec:
  selfSigned: {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: s3
  labels:
    app.kubernetes.io/name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
          envFrom:
            - secretRef:
                name: rustfs-root
          ports:
            - name: s3
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: logs, mountPath: /logs}
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: s3
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
