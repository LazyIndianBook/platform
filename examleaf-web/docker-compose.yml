# The whole ExamLeaf stack on one machine: PostgreSQL 17, Redis 7, the Django site (gunicorn), the Celery worker and
# beat, and Caddy for https. Settings come from .env (see .env.example); DEPLOYMENT.md walks through a first deployment.
#   Production:  DOMAIN=examleaf.in   (Caddy gets a Let's Encrypt certificate)
#   Development: DOMAIN=localhost     (Caddy's local certificate; `docker compose exec caddy caddy trust` once)

x-image: &image  # the site's image, as every service but the media worker runs it (x-app) and as that one does
  build: .
  image: examleaf-web
  restart: unless-stopped
  volumes:
    - media:/app/media
  # docker logs: JSON lines, rotated at 50 MB, ten files a service (500 MB): CERT-In's 180 days of logs at our traffic,
  # and their copy off the server (DEPLOYMENT.md section 10; examleaf/retention.py "security_logs")
  logging: &logging
    driver: json-file
    options: {max-size: 50m, max-file: "10"}

# The media worker's environment (M5): it runs FFmpeg on videos that come from outside, so it gets the database, the
# queue, the buckets and SECRET_KEY, and none of the other secrets (Razorpay, MSG91, email, Google, Sentry, Firebase):
# no env_file. A name without a value is read from .env, and left unset when .env has none.
x-media-env: &media-env
  DATABASE_URL: postgres://examleaf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/examleaf
  CELERY_BROKER_URL: redis://redis:6379/0
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  SECRET_KEY:
  MEDIA_BUCKET:
  PUBLIC_MEDIA_BUCKET:
  PUBLIC_MEDIA_DOMAIN:
  S3_ENDPOINT_URL:
  S3_REGION:
  S3_ACCESS_KEY_ID:
  S3_SECRET_ACCESS_KEY:
  PUBLIC_S3_ENDPOINT_URL:
  PUBLIC_S3_REGION:
  PUBLIC_S3_ACCESS_KEY_ID:
  PUBLIC_S3_SECRET_ACCESS_KEY:
  LEARN_PUBLIC_VIDEO:
  LEARN_MAX_UPLOAD_MB:
  LOG_LEVEL:

x-app: &app
  <<: *image
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://examleaf:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/examleaf
    CACHE_URL: redis://redis-cache:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    PROXY_COUNT: 1  # Caddy
    PAPERS_ROOT: /book  # the books checkout (BOOK_SOURCE), mounted below
    AWS_REQUEST_CHECKSUM_CALCULATION: when_required  # boto3 with Cloudflare R2 (settings.py, "Two S3-compatible buckets")
    AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    redis-cache: {condition: service_healthy}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: examleaf
      POSTGRES_USER: examleaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "examleaf", "-d", "examleaf"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:  # Celery's queue, saved to disk so that queued emails survive a restart; nothing in it is ever evicted
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis-cache:  # the cache (rate limits, throttles, cached pages): at most 256 MB, the least used keys make room
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  web:
    <<: *app
    # Migrations and the role groups are brought up to date on every start (one web container: no race), then the
    # readiness check (the database, no migration waiting; django-health-check's command) must pass before gunicorn
    # starts; otherwise the container stops and is restarted. The cache and the buckets are not waited for: the site
    # runs without them, and /health/ (the uptime monitor) reports them.
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py bootstrap_roles
      && python manage.py health_check health_web --no-http
      && exec gunicorn --config gunicorn.conf.py examleaf.wsgi"
    # gunicorn.conf.py (the image's own command too): WEB_CONCURRENCY processes of GUNICORN_THREADS threads (H1: a slow
    # request holds one thread, not a process), their timeouts and recycling, each from .env (RESILIENCE.md). Clip
    # videos never come through here in production: the browser sends them to the bucket. On stop, the requests in
    # progress get gunicorn's 30 seconds (GUNICORN_GRACEFUL_TIMEOUT) before Docker's kill.
    stop_grace_period: 40s
    environment:
      <<: *app-env
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # the frontend's server-side calls come straight from the frontend container with the site's host in
      # X-Forwarded-Host (as Caddy's do): Django builds its links and checks ALLOWED_HOSTS with it
      USE_X_FORWARDED_HOST: 1
    volumes: &books
      - media:/app/media
      - ${BOOK_SOURCE:-../../Class 12}/production:/book/production:ro  # the books' Markdown papers, for import_papers
    healthcheck:  # liveness: gunicorn answers (/health/live/ reads neither the database nor Redis)
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/live/', headers={'Host': os.environ['DOMAIN'], 'X-Forwarded-Proto': 'https'}), timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  worker:
    <<: *app
    command: celery -A examleaf worker --loglevel INFO --concurrency 2
    # The panel's staff jobs run here, not in web, and the Content module's import is one: it reads the books' folder
    # (PAPERS_ROOT=/book) from here too. Without the mount a job answers "No production/ folder in /book".
    volumes: *books
    # SIGTERM is Celery's warm shutdown: the tasks in progress finish (the hard limit is 300 s) before Docker's kill;
    # a task cut short anyway goes to another worker later (acks_late, RESILIENCE.md)
    stop_grace_period: 5m
    depends_on:
      web: {condition: service_healthy}

  beat:
    <<: *app
    command: celery -A examleaf beat --loglevel INFO
    depends_on:
      web: {condition: service_healthy}

  media-worker:  # ffmpeg for the revision course's clips (queue "media", learn/tasks.py): one video at a time
    <<: *image
    environment: *media-env  # its own, small environment (M5): not .env
    command: celery -A examleaf worker --queues media --hostname media@%h --loglevel INFO --concurrency 1
    stop_grace_period: 5m  # a clip being made may finish; a longer one is made again later (acks_late)
    depends_on:
      web: {condition: service_healthy}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # /health/ answers only requests carrying this token (the uptime monitor); see DEPLOYMENT.md.
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:?set HEALTH_CHECK_TOKEN in .env}
      # who answers the website's pages (Caddyfile): the Next.js frontend; Django keeps only its own paths
      PAGES_UPSTREAM: ${PAGES_UPSTREAM:-frontend:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend
    logging: *logging

  frontend:  # the Next.js frontend (../examleaf-frontend, Phase 8): its own image, health check and rollout
    build:
      context: ../examleaf-frontend
      args:  # compiled into the build: change one, then `docker compose build frontend`
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN in .env}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_MEDIA_HOST: ${PUBLIC_MEDIA_DOMAIN:-}
    image: examleaf-frontend
    stop_grace_period: 15s  # the apps answer requests in flight for up to 10 s after SIGTERM (RESILIENCE.md)
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE: http://web:8000  # server components call Django over the compose network
      # sent with each of those calls (X-Internal-Token): Django then counts the visitor's address, not the frontend's
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env (DEPLOYMENT.md)}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?set DOMAIN in .env}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_MEDIA_HOST: ${PUBLIC_MEDIA_DOMAIN:-}
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache:mode=1777"]  # Next.js keeps its data cache here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  admin:  # the staff console (../examleaf-admin) at admin.${DOMAIN}, behind Caddy's second site; only with the profile:
    # `docker compose --profile admin up -d`. Django must answer that host too: ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS
    # (examleaf-admin/README.md, "Deploy"). No port is published: every request comes through Caddy, which drops
    # X-Middleware-Subrequest on the way (Caddyfile).
    profiles: [admin]
    build:
      context: ../examleaf-admin
      args:  # compiled into the build: change one, then `docker compose --profile admin build admin`
        NEXT_PUBLIC_SITE_URL: https://admin.${DOMAIN:?set DOMAIN in .env}
        NEXT_PUBLIC_WEBSITE_URL: https://${DOMAIN:?set DOMAIN in .env}
        NEXT_PUBLIC_ERP_URL: ${ERP_URL:-}
    image: examleaf-admin
    stop_grace_period: 15s  # the apps answer requests in flight for up to 10 s after SIGTERM (RESILIENCE.md)
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE: http://web:8000  # server components call Django over the compose network
      # sent with each of those calls (X-Internal-Token): Django then counts the person's address, not the console's
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env (DEPLOYMENT.md)}
      NEXT_PUBLIC_SITE_URL: https://admin.${DOMAIN:?set DOMAIN in .env}
      NEXT_PUBLIC_WEBSITE_URL: https://${DOMAIN:?set DOMAIN in .env}
      NEXT_PUBLIC_ERP_URL: ${ERP_URL:-}
    depends_on:
      web: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache:mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  pgdata:
  redisdata:
  media:
  caddy_data:
  caddy_config:
