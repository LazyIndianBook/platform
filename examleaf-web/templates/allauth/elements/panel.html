{% load allauth %}<section class="card">

  <div class="card-body">{% slot body %}{% endslot %}</div>
  {% if slots.actions %}<div class="card-footer">{% for action in slots.actions %}{{ action }}{% endfor %}</div>{% endif %}
</section>
