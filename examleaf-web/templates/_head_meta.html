{% load static web %}{# Inside <head> of base.html (Phase 5 B): canonical link, link previews, web app manifest, JSON-LD. A view may give `og` (type, title, description, image) and `jsonld` (a list of dicts). #}
<link rel="canonical" href="{{ site_url }}{{ request.path }}">
<meta property="og:site_name" content="ExamLeaf">
<meta property="og:type" content="{{ og.type|default:"website" }}">
<meta property="og:title" content="{{ og.title|default:"ExamLeaf Sample Papers" }}">
<meta property="og:description" content="{{ og.description|default:"Practice papers for the Assam Board (ASSEB) Class 12 examination, with free worked solutions behind a QR code." }}">
<meta property="og:url" content="{{ site_url }}{{ request.path }}">
<meta property="og:image" content="{% if og.image %}{{ og.image|absolute }}{% else %}{{ site_url }}{% static 'img/og-default.jpg' %}{% endif %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="{% url 'manifest' %}">
{% for data in jsonld %}{% jsonld data %}{% endfor %}
