{% extends "account/base_entrance.html" %}
{# allauth's page with the site's words: Log out, as in the header #}
{% block head_title %}Log out{% endblock head_title %}
{% block content %}
<h1>Log out</h1>
<p class="muted">Log out of ExamLeaf on this device?</p>
<form class="form-col" method="post" action="{% url 'account_logout' %}">
  {% csrf_token %}
  {{ redirect_field }}
  <div class="row"><button type="submit" class="btn btn-primary">Log out</button></div>
</form>
{% endblock content %}
