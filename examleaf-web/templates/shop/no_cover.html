{# The cover drawn for a product without a picture (components.md section 2, .no-cover). With: product. #}<div class="no-cover{% if product.subject %} subject-{{ product.subject.name|lower }}{% endif %}" aria-hidden="true"><span>Exam<span class="brand-leaf">Leaf</span></span><span class="no-cover-name"><strong>{{ product.subject.name|default:product.title }}</strong><span class="pill">{{ product.get_kind_display }}</span></span><span>{% if product.subject %}Class {{ product.subject.class_level.number }}{% endif %}</span></div>
