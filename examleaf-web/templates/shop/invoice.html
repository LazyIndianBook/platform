<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }} {{ document.number }}</title>
<style>
  /* WeasyPrint (shop/invoices.py), drawn in ExamLeaf A - Gaps and edge pages "GST invoice": white paper, the wordmark in
     a serif, labels, codes and amounts in a mono, hairlines in the paper's tone, the one red thing a double rule under
     the head. The fonts are the system ones the Docker image has (DejaVu, Noto: also the rupee sign and any script a
     customer's name is typed in) after the site's own where installed; Hind Siliguri, from static/fonts (base_url is
     the project folder; the URL fetcher allows the static folders only), is the text face and covers Bengali and
     Assamese in every stack. */
  @font-face { font-family: "Hind Siliguri"; font-weight: 400; src: url("static/fonts/hind-siliguri-400.woff2") format("woff2"); }
  @font-face { font-family: "Hind Siliguri"; font-weight: 600; src: url("static/fonts/hind-siliguri-600.woff2") format("woff2"); }
  @font-face { font-family: "Hind Siliguri"; font-weight: 400; src: url("static/fonts/hind-siliguri-400-bengali.woff2") format("woff2"); unicode-range: U+0980-09FE, U+200C-200D, U+25CC; }
  @font-face { font-family: "Hind Siliguri"; font-weight: 600; src: url("static/fonts/hind-siliguri-600-bengali.woff2") format("woff2"); unicode-range: U+0980-09FE, U+200C-200D, U+25CC; }
  @page { size: A4; margin: 16mm 14mm 18mm; @bottom-center { content: "Page " counter(page) " of " counter(pages); font: 7pt "IBM Plex Mono", "DejaVu Sans Mono", "Noto Sans Mono", Menlo, "Courier New", monospace; color: #5b6170; } }
  :root {
    --ink: #1d2230; --muted: #5b6170; --hair: #dcd4c4;
    --serif: "Source Serif 4", Georgia, "DejaVu Serif", "Noto Serif", serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Noto Sans Mono", Menlo, "Courier New", "Hind Siliguri", monospace;
  }
  body { font: 9pt/1.45 "Public Sans", "Hind Siliguri", "DejaVu Sans", "Noto Sans", sans-serif; color: var(--ink); }
  p { margin: 0; }
  strong { font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; padding-bottom: 4mm; border-bottom: 3px double #b3342a; }
  .brand { margin: 0 0 3mm; font: 700 20pt/1 var(--serif); }
  .brand span { color: #1a6e30; }
  .seller { font-size: 8.5pt; line-height: 1.5; color: var(--muted); }
  .seller strong { color: var(--ink); }
  .head > div { flex: 1; }
  .doc { text-align: right; }
  h1 { margin: 0 0 1.5mm; font: 600 13pt/1.25 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .doc p { font: 500 8.5pt/1.5 var(--mono); color: var(--muted); }
  .parties { display: flex; gap: 8mm; margin: 5mm 0 0; font-size: 8.5pt; }
  .parties > div { flex: 1; }
  .label { margin: 0 0 1mm; font: 500 7.5pt/1.2 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 4mm; font-size: 8.5pt; }
  th, td { padding: 1.8mm 2mm; vertical-align: top; border-bottom: 1px solid var(--hair); }
  tr { break-inside: avoid; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  thead th { border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--ink); vertical-align: bottom; font: 500 6.5pt/1.25 var(--mono); letter-spacing: 0.04em; text-transform: uppercase; text-align: left; color: var(--muted); }
  .num { text-align: right; white-space: nowrap; font-family: var(--mono); }
  thead .num { text-align: right; }
  .code { font-family: var(--mono); }
  .item { width: 30%; }
  .totals { width: 58%; margin-left: auto; font-size: 9pt; }
  .totals th { font-weight: 400; text-align: left; }
  .grand th, .grand td { padding-top: 2.4mm; border-top: 1.5px solid var(--ink); border-bottom: 0; font-size: 10pt; font-weight: 700; }
  .note { margin-top: 5mm; font-size: 8pt; color: var(--muted); }
  .copy { break-a<body>
{% for copy_mark in copies %}
<section class="copy">
<div class="head">
  <div>
    <p class="brand">Exam<span>Leaf</span></p>
    <div class="seller">
      <p><strong>{{ seller.name }}</strong></p>
      <p>{{ seller.address }}</p>
      <p>GSTIN: <span class="code">{{ seller.gstin|default:"not registered" }}</span> · State: {{ seller_state }} ({{ seller.state_code }})</p>
      <p>{{ seller.email }} · {{ seller.phone }}</p>
    </div>
  </div>
  <div class="doc">
    {% if copy_mark %}<p class="mark">{{ copy_mark }}</p>{% endif %}
    <h1>{{ title }}{% if document.is_test %} (test: not a tax document){% endif %}</h1>
    {% if document.cancelled_at %}<p class="cancelled">Cancelled on {{ document.cancelled_at|date:"j F Y" }}</p>{% endif %}
    <p><strong>{{ document.number }}</strong> · {{ document.created|date:"j F Y" }}</p>
    {% block reference %}<p>Order {{ order.number }}{% if order.placed_at %} of {{ order.placed_at|date:"j F Y" }}{% endif %} · {{ order.get_payment_method_display }}{% if order.payment_reference %}, reference {{ order.payment_reference }}{% endif %}</p>{% endblock %}
  </div>
</div>

<div class="parties">
  <div>
    <p class="label">{% if goods %}Billed and shipped to{% else %}Billed to{% endif %}</p>
    {% for line in buyer_lines %}<p>{{ line }}</p>{% endfor %}
    <p>{{ order.email }}</p>
  </div>
  <div>
    <p class="label">Place of supply</p>
    <p>{{ place_of_supply }} ({{ intra_state|yesno:"same state as the seller: CGST and SGST,another state: IGST" }})</p>
    {% if billed_elsewhere %}<p>The billing state given at checkout.</p>{% endif %}
    <p class="label" style="margin-top: 2mm">Reverse charge</p>
    <p>No</p>
  </div>
</div>

{% block body %}
<table>
  <thead>
    <tr>
      <th>#</th><th class="item">Item</th><th>HSN/SAC</th><th class="num">Qty</th><th class="num">Rate (₹)</th><th class="num">Discount (₹)</th>
      <th class="num">Taxable value (₹)</th>
      {% if intra_state %}<th class="num">CGST</th><th class="num">SGST</th>{% else %}<th class="num">IGST</th>{% endif %}
      <th class="num">Amount (₹)</th>
    </tr>
  </thead>
  <tbody>
  {% for line in lines %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ line.item.title }}{% if line.bundle %}<br><span class="sub">part of {{ line.bundle }}</span>{% endif %}</td>
      <td class="code">{{ line.hsn }}</td>
      <td class="num">{{ line.item.quantity }}</td>
      <td class="num">{{ line.item.unit_price.amount }}</td>
      <td class="num">{{ line.discount }}</td>
      <td class="num">{{ line.taxable }}</td>
      {% if intra_state %}
      <td class="num">{{ line.half_rate|floatformat:2 }} %<br>{{ line.cgst }}</td>
      <td class="num">{{ line.half_rate|floatformat:2 }} %<br>{{ line.sgst }}</td>
      {% else %}
      <td class="num">{{ line.item.gst_rate|floatformat:2 }} %<br>{{ line.igst }}</td>
      {% endif %}
      <td class="num">{{ line.amount|floatformat:2 }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<table class="totals">
  <tr><th>Items (prices include tax)</th><td class="num">₹{{ order.subtotal.amount }}</td></tr>
  {% with savings=order.discount_lines.all %}{% for saving in savings %}<tr><th>{{ saving.label }}</th><td class="num">−₹{{ saving.amount.amount }}</td></tr>
  {% empty %}{% if order.discount.amount %}<tr><th>Discount{% if order.coupon_code %} ({{ order.coupon_code }}){% endif %}</th><td class="num">−₹{{ order.discount.amount }}</td></tr>{% endif %}{% endfor %}{% endwith %}
  {% for charge in charges %}<tr><th>{{ charge.label }} (with the goods{% if charge.rate %}, GST {{ charge.rate|floatformat:2 }} %{% else %}: not taxed{% endif %})</th><td class="num">₹{{ charge.amount }}</td></tr>
  {% empty %}{% if goods %}<tr><th>Shipping</th><td class="num">₹0.00</td></tr>{% endif %}{% endfor %}
  {% if round_off %}<tr><th>Round off</th><td class="num">₹{{ round_off }}</td></tr>{% endif %}
  <tr class="grand"><th>Total</th><td class="num">₹{{ order.total.amount }}</td></tr>
</table>

<table class="summary">
  <tr><th>Taxable value</th><td class="num">₹{{ taxable_total }}</td></tr>
  <tr><th>GST</th><td class="num">₹{{ tax_total }}</td></tr>
  <tr><th>Exempt, nil-rated and non-GST value</th><td class="num">₹{{ exempt_total }}</td></tr>
</table>

{% if exemptions %}<div class="note"><p>Not taxed:</p><ul class="reasons">{% for reason in exemptions %}<li>{{ reason }}</li>{% endfor %}</ul></div>{% endif %}
<p class="note">Prices include any tax. HSN and SAC codes to {{ hsn_digits }} digits. This document is computer generated and needs no signature.</p>
{% endblock %}
</section>
{% endfor %}
</body>
</html>
