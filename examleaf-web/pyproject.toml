# Tool settings only (the site is not a package). Dependencies are pinned in requirements.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "examleaf.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:django_guid",
    "ignore:unclosed database:ResourceWarning",  # SQLite connections of the health check's worker threads
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "*/migrations/*", "*/tests.py", "*/test_*.py", "*/factories.py", "conftest.py", "manage.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["staticfiles", "*/migrations/*"]  # migrations are generated by Django

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "content", "examleaf", "ops", "pages", "practice"]
